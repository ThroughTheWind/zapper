name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The backlog gates compare item status with what git says merged.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .ai/rungs.mjs check full

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Format
        run: ./gradlew spotlessCheck
      - name: Adapter boundaries
        run: ./gradlew checkAdapterBoundaries
      - name: Unit tests
        run: ./gradlew test
      - name: Android lint
        run: ./gradlew lint
      - name: Debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: zapper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
