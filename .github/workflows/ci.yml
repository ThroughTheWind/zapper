name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The backlog gates compare item status with what git says merged.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node .ai/rungs.mjs check full

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Format
        run: ./gradlew spotlessCheck
      - name: Unit tests
        run: ./gradlew test
      - name: Android lint
        run: ./gradlew lint
      - name: Debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: zapper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # Every push to main refreshes the "dev" pre-release with a debug APK, so the
  # app can be installed on a phone straight from the Releases page.
  dev-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gates, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: zapper-debug-apk
          path: apk
      - name: Publish the dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv apk/*.apk zapper-dev-debug.apk
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev zapper-dev-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Development build" \
            --notes "Debug build of main at ${GITHUB_SHA::7}. Not signed for release; install by allowing installs from your browser."
