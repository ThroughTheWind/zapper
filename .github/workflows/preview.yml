name: Preview

# Builds "Zapper Preview" from a branch or pull request and publishes it as a GitHub pre-release,
# so people can try a change before it merges. Run it by hand: Actions → Preview → Run workflow.
# The preview is a separate app (io.github.throughthewind.zapper.preview) that installs beside the
# release, signed with its own key. Procedure, secrets and tester instructions: docs/previews.md.
#
# The branch's code runs only in the build job, which holds no secret and cannot write to the
# repository. The publish job never checks the branch out: it signs and publishes the built APK.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch name, or pull request number (for example 42)"
        required: true
        type: string
      issues:
        description: "Issues to announce the build on, comma-separated (for example 24,33). Optional."
        required: false
        type: string
      notes:
        description: "What testers should try. Optional; shown on the release page and in the announcement."
        required: false
        type: string

permissions:
  contents: read

# One run per source at a time. A single shared group would not queue several previews: GitHub
# keeps one pending run per group and cancels the others, so starting previews of three branches
# in a row built only the first and the last.
concurrency:
  group: preview-${{ inputs.ref }}
  cancel-in-progress: false

defaults:
  run:
    # Explicit bash runs every step with -e and -o pipefail.
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      label: ${{ steps.source.outputs.label }}
      pr: ${{ steps.source.outputs.pr }}
    steps:
      - name: Resolve the source
        id: source
        env:
          REF_INPUT: ${{ inputs.ref }}
        run: |
          ref="${REF_INPUT#\#}"
          if [[ "$ref" =~ ^[0-9]+$ ]]; then
            {
              echo "checkout=refs/pull/$ref/head"
              echo "label=pull request #$ref"
              echo "pr=$ref"
            } >> "$GITHUB_OUTPUT"
          elif git check-ref-format --branch "$ref" > /dev/null 2>&1; then
            {
              echo "checkout=$ref"
              echo "label=branch $ref"
              echo "pr="
            } >> "$GITHUB_OUTPUT"
          else
            echo "::error::'$REF_INPUT' is neither a pull request number nor a branch name"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.checkout }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The branch may not be reviewed yet; it must not write the cache that main's builds read.
          cache-read-only: true

      - name: Read the version
        id: version
        env:
          PREVIEW_NUMBER: ${{ github.run_number }}
        run: |
          version="$(sed -n 's/^zapper = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          if [[ -z "$version" ]]; then
            echo "::error::No zapper version in gradle/libs.versions.toml"
            exit 1
          fi
          {
            echo "version=$version-preview.$PREVIEW_NUMBER"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Tests and the unsigned preview APK
        env:
          PREVIEW_NUMBER: ${{ github.run_number }}
        run: ./gradlew test :app:assemblePreview -PzapperPreviewNumber="$PREVIEW_NUMBER"

      # Previews are for real TVs: like release, they must not link the simulated TV.
      - name: No simulated TV in the preview
        run: |
          ./gradlew :app:dependencies --configuration previewRuntimeClasspath > preview-deps.txt
          if grep -q "adapters:fake" preview-deps.txt; then
            echo "::error::The preview build links :adapters:fake (the simulated TV)"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: zapper-preview-unsigned
          path: app/build/outputs/apk/preview/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      SHA: ${{ needs.build.outputs.sha }}
      LABEL: ${{ needs.build.outputs.label }}
      PR: ${{ needs.build.outputs.pr }}
      PREVIEW_NUMBER: ${{ github.run_number }}
    steps:
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v8
        with:
          name: zapper-preview-unsigned
          path: unsigned

      - name: Restore the preview signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZAPPER_PREVIEW_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ZAPPER_PREVIEW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZAPPER_PREVIEW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZAPPER_PREVIEW_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::The secret ZAPPER_PREVIEW_$name is not set. See docs/previews.md, \"One-time setup\"."
              exit 1
            fi
          done
          base64 --decode <<< "$KEYSTORE_BASE64" > "$RUNNER_TEMP/zapper-preview.jks"

          # apksigner only says the entry "does not contain a key". Name the likely cause instead.
          if ! keytool -list -keystore "$RUNNER_TEMP/zapper-preview.jks" -storepass:env KEYSTORE_PASSWORD \
              -alias "$KEY_ALIAS" 2> /dev/null | grep -q PrivateKeyEntry; then
            echo "::error::The keystore has no private key under ZAPPER_PREVIEW_KEY_ALIAS, or ZAPPER_PREVIEW_KEYSTORE_PASSWORD is wrong. Check the alias for a trailing newline or space, and compare it with 'keytool -list -keystore zapper-preview.jks'."
            exit 1
          fi

      - name: Sign and verify the APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ZAPPER_PREVIEW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZAPPER_PREVIEW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZAPPER_PREVIEW_KEY_PASSWORD }}
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          shopt -s nullglob
          unsigned=(unsigned/*.apk)
          if (( ${#unsigned[@]} != 1 )); then
            echo "::error::Expected one unsigned APK, found ${#unsigned[@]}"
            ls -R unsigned || true
            exit 1
          fi
          mkdir dist
          apk="dist/zapper-preview-$VERSION.apk"
          "$build_tools/zipalign" -f -p 4 "${unsigned[0]}" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/zapper-preview.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/zapper-preview.jks"

          # Check the artifact, not the build script: signed, the preview app, numbered, not debuggable.
          "$build_tools/apksigner" verify --verbose "$apk"
          badging="$("$build_tools/aapt2" dump badging "$apk")"
          expect() {
            if ! grep -qF "$1" <<< "$badging"; then
              echo "::error::The APK lacks $1"
              grep -E "^(package|application-label):" <<< "$badging"
              exit 1
            fi
          }
          expect "package: name='io.github.throughthewind.zapper.preview'"
          expect "versionCode='$PREVIEW_NUMBER'"
          expect "versionName='$VERSION'"
          expect "application-label:'Zapper Preview'"
          if grep -q "application-debuggable" <<< "$badging"; then
            echo "::error::The preview APK is debuggable"
            exit 1
          fi

          (cd dist && sha256sum "zapper-preview-$VERSION.apk" > "zapper-preview-$VERSION.apk.sha256")
          apk_sha256="$(cut -d ' ' -f 1 "$apk.sha256")"
          certs="$("$build_tools/apksigner" verify --print-certs "$apk")"
          cert_sha256="$(grep -iE 'certificate SHA-?256 digest' <<< "$certs" | head -n 1 | sed -E 's/.*[Dd]igest: *//' || true)"
          if [[ ! "$cert_sha256" =~ ^[0-9a-fA-F:]{64,95}$ ]]; then
            echo "::error::Could not read the signing certificate digest from apksigner --print-certs:"
            echo "$certs"
            exit 1
          fi
          echo "APK_SHA256=$apk_sha256" >> "$GITHUB_ENV"
          echo "CERT_SHA256=$cert_sha256" >> "$GITHUB_ENV"

      - name: Write the release notes
        env:
          NOTES: ${{ inputs.notes }}
          SERVER: ${{ github.server_url }}
        run: |
          {
            echo "**Preview build of $LABEL** at [\`${SHA::7}\`]($SERVER/$GH_REPO/commit/$SHA). Not a release: it has not been merged and may break."
            echo
            if [[ -n "$NOTES" ]]; then
              echo "### What to try"
              echo
              echo "$NOTES"
              echo
            fi
            echo "### Install"
            echo
            echo "Download \`zapper-preview-$VERSION.apk\` below on your phone and open it. It installs as a separate app called **Zapper Preview**, so the Zapper you already have stays as it is. Each new preview installs over the previous one."
            echo
            echo "With [Obtainium](https://obtainium.imranr.dev/), add this repository with *Include prereleases* on and *Filter release titles by regular expression* set to \`^Zapper Preview\`."
            echo
            echo "### Report back"
            echo
            echo "Comment on the issue or pull request that linked you here with your TV's brand, model and year, and what worked and what did not."
            echo
            echo "### Checksums"
            echo
            echo "- APK SHA-256: \`$APK_SHA256\`"
            echo "- Preview signing certificate SHA-256: \`$CERT_SHA256\`"
          } > dist/release-notes.md
          cat dist/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        # The tag is the version name, without the v that would match release.yml's tag pattern.
        run: |
          gh release create "$VERSION" \
            "dist/zapper-preview-$VERSION.apk" \
            "dist/zapper-preview-$VERSION.apk.sha256" \
            --prerelease \
            --target "$SHA" \
            --title "Zapper Preview $VERSION ($LABEL)" \
            --notes-file dist/release-notes.md
          echo "RELEASE_URL=$(gh release view "$VERSION" --json url --jq .url)" >> "$GITHUB_ENV"

      - name: Announce on the pull request and issues
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUES: ${{ inputs.issues }}
          NOTES: ${{ inputs.notes }}
        run: |
          targets=()
          [[ -n "$PR" ]] && targets+=("$PR")
          for issue in ${ISSUES//,/ }; do
            issue="${issue#\#}"
            if [[ ! "$issue" =~ ^[0-9]+$ ]]; then
              echo "::error::'$issue' is not an issue number"
              exit 1
            fi
            targets+=("$issue")
          done
          if (( ${#targets[@]} == 0 )); then
            echo "Nothing to announce on."
            exit 0
          fi
          {
            echo "A preview build is ready to try: **[Zapper Preview $VERSION]($RELEASE_URL)**."
            echo
            if [[ -n "$NOTES" ]]; then
              echo "$NOTES"
              echo
            fi
            echo "It installs as a separate app called Zapper Preview, next to the Zapper you already have. Please reply here with your TV's brand, model and year, and what worked and what did not."
          } > comment.md
          # Deduplicate: a pull request number may also be listed as an issue. The issues API
          # comments on pull requests too.
          for target in $(printf '%s\n' "${targets[@]}" | sort -un); do
            gh api "repos/$GH_REPO/issues/$target/comments" -F body=@comment.md --jq .html_url
          done
