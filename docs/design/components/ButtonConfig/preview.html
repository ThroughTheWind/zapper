<!-- @dsCard group="Customisation" height=600 subtitle="Per-button options sheet" -->
<div style="padding:24px;width:360px">
  <div class="bsheet">
    <div class="handle"></div>
    <div class="row" style="padding:0 24px 16px"><span class="rk rk--tertiary" style="width:56px;height:56px"><span class="ms">input</span></span><div class="grow"><div class="title-medium">Source</div><div class="body-small" style="color:var(--on-surface-variant)">Action: Open input list</div></div></div>
    <div class="stack" style="padding:0 24px">
      <div class="field"><span class="lbl">Label (optional)</span><span class="ph">e.g. HDMI</span></div>
      <div class="row"><span class="body-large grow">Icon</span><span class="rk" style="width:40px;height:40px;border-radius:12px"><span class="ms sm">input</span></span><span class="btn btn--text">Change</span></div>
      <div><div class="body-large" style="margin-bottom:8px">Colour</div>
        <div class="swatches">
          <span class="sw" style="background:var(--surface-container-high)"></span>
          <span class="sw" style="background:var(--primary)"></span>
          <span class="sw" style="background:var(--secondary-container)"></span>
          <span class="sw on" style="background:var(--tertiary-container)"></span>
          <span class="sw" style="background:transparent;box-shadow:inset 0 0 0 1px var(--outline)"></span>
        </div></div>
      <div class="row"><span class="body-large grow">Repeat while held</span><span class="switch"></span></div>
      <div class="row" style="justify-content:space-between;margin-top:4px"><span class="btn btn--text" style="color:var(--error);margin-left:-12px"><span class="ms sm">delete</span>Remove</span><span class="btn btn--filled">Done</span></div>
    </div>
  </div>
</div>
