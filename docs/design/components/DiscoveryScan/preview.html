<!-- @dsCard group="Connection" height=470 subtitle="Scanning and not-found states" -->
<div class="row" style="padding:24px;gap:48px;align-items:flex-start">
  <div style="width:300px;text-align:center">
    <div class="scan"><span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><div class="core"><span class="ms">tv</span></div></div>
    <div class="title-medium">Looking for TVs…</div>
    <div class="body-medium" style="color:var(--on-surface-variant)">Make sure your TV is on and on the same Wi-Fi.</div>
  </div>
  <div style="width:330px" class="stack">
    <div class="banner"><span class="ms">help</span><div><b>No TV found</b>
      <ul class="tips body-medium"><li>TV is on and on the same Wi-Fi</li><li>Not on a guest network (devices can't see each other)</li><li>Zapper isn't blocked in the TV's Device Connection Manager</li></ul>
      <div class="acts"><span class="btn btn--text">Scan again</span></div></div></div>
    <span class="btn btn--tonal btn--block"><span class="ms sm">add</span>Add by IP address</span>
  </div>
</div>
