<!-- @dsCard group="Customisation" height=640 subtitle="Rearranging, resizing and adding widgets" -->
<div class="edit" style="display:flex;gap:32px;padding:16px;align-items:flex-start;flex-wrap:wrap">
  <div style="width:360px;border-radius:28px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--outline-variant);overflow:hidden">
    <div class="topbar" style="padding:0 8px"><button class="btn btn--text"><span class="ms sm">undo</span>Undo</button><div style="flex:1;text-align:center" class="title-medium">Edit layout</div><button class="btn btn--filled">Done</button></div>
    <div class="grid" style="grid-template-rows:repeat(5,72px)">
      <div class="w" style="grid-column:1;grid-row:1"><span class="rm ms sm" style="font-size:16px">close</span><button class="rk rk--power"><span class="ms">power_settings_new</span></button></div>
      <div class="w" style="grid-column:2;grid-row:1"><span class="rm ms sm" style="font-size:16px">close</span><button class="rk"><span class="ms">input</span></button></div>
      <div class="drop" style="grid-column:3;grid-row:1"></div>
      <div class="w" style="grid-column:4;grid-row:1"><span class="rm ms sm" style="font-size:16px">close</span><button class="rk"><span class="ms">volume_off</span></button></div>
      <div class="w is-selected" style="grid-column:3 / span 2;grid-row:2"><span class="rm ms sm" style="font-size:16px">close</span><button class="app"><span class="mono">N</span>Netflix</button><span class="rs"></span></div>
      <div class="w" style="grid-column:1 / span 2;grid-row:2"><span class="rm ms sm" style="font-size:16px">close</span><button class="app app--secondary"><span class="mono">Y</span>YouTube</button></div>
      <div class="w" style="grid-column:1;grid-row:3 / span 3;border-radius:999px"><span class="rm ms sm" style="font-size:16px">close</span><div class="rocker" style="height:100%;width:100%"><button><span class="ms">add</span></button><span class="lbl">VOL</span><button><span class="ms">remove</span></button></div></div>
      <div class="w" style="grid-column:2 / span 2;grid-row:3;"><span class="rm ms sm" style="font-size:16px">close</span><button class="rk rk--secondary"><span class="ms">home</span></button></div>
      <div class="w" style="grid-column:4;grid-row:3 / span 3;border-radius:999px"><span class="rm ms sm" style="font-size:16px">close</span><div class="rocker" style="height:100%;width:100%"><button><span class="ms">keyboard_arrow_up</span></button><span class="lbl">CH</span><button><span class="ms">keyboard_arrow_down</span></button></div></div>
      <div class="drop is-invalid" style="grid-column:2 / span 2;grid-row:4 / span 2"></div>
    </div>
    <div class="sheet">
      <div class="handle"></div><h4>Add widget</h4>
      <div class="palette">
        <div class="it"><button class="rk"><span class="ms">radio_button_checked</span></button>D-pad</div>
        <div class="it"><button class="rk"><span class="ms">swipe</span></button>Touchpad</div>
        <div class="it"><button class="rk"><span class="ms">dialpad</span></button>Numbers</div>
        <div class="it"><button class="rk"><span class="ms">apps</span></button>App</div>
      </div>
    </div>
  </div>
  <div style="max-width:300px;display:flex;flex-direction:column;gap:16px">
    <div><div class="cap label-small" style="color:var(--on-surface-variant);text-transform:uppercase">Legend</div></div>
    <div style="display:flex;gap:12px;align-items:center"><div style="width:40px;height:40px;border-radius:12px;outline:1.5px dashed var(--outline);outline-offset:3px;background:var(--surface-container-high)"></div><span class="body-medium">Editable widget (gentle wiggle)</span></div>
    <div style="display:flex;gap:12px;align-items:center"><div style="width:40px;height:40px;border-radius:12px;outline:2px solid var(--primary);outline-offset:3px;background:var(--surface-container-high);box-shadow:var(--elevation-5)"></div><span class="body-medium">Selected / dragging, with resize handle</span></div>
    <div style="display:flex;gap:12px;align-items:center"><div class="drop" style="width:40px;height:40px;border-radius:12px"></div><span class="body-medium">Valid drop target</span></div>
    <div style="display:flex;gap:12px;align-items:center"><div class="drop is-invalid" style="width:40px;height:40px;border-radius:12px"></div><span class="body-medium">Invalid drop (overlaps)</span></div>
  </div>
</div>
