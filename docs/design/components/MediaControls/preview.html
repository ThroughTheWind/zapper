<!-- @dsCard group="Keys" height=180 subtitle="Media transport bar, 4x1" -->
<div class="demo-row">
  <div class="grid" style="padding:0;grid-template-columns:repeat(4,72px)">
    <button class="rk" aria-label="Rewind"><span class="ms">fast_rewind</span></button>
    <button class="rk rk--primary rk--round" style="grid-column:span 2" aria-label="Play or pause"><span class="ms">play_pause</span></button>
    <button class="rk" aria-label="Fast forward"><span class="ms">fast_forward</span></button>
  </div>
  <div class="grid" style="padding:0;grid-template-columns:repeat(4,72px)">
    <button class="rk rk--ghost" aria-label="Previous"><span class="ms">skip_previous</span></button>
    <button class="rk rk--ghost" aria-label="Stop"><span class="ms">stop</span></button>
    <button class="rk rk--ghost" aria-label="Record"><span class="ms">fiber_manual_record</span></button>
    <button class="rk rk--ghost" aria-label="Next"><span class="ms">skip_next</span></button>
  </div>
</div>
