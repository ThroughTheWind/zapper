<!-- @dsCard group="Customisation" height=330 subtitle="Pages, page dots and the trash zone" -->
<div style="padding:24px;width:380px" class="stack">
  <div class="cap label-small" style="color:var(--on-surface-variant)">EDIT MODE PAGE BAR</div>
  <div class="pages" style="padding:0"><span class="ptab on">Main</span><span class="ptab">Apps</span><span class="ptab">Numbers</span><span class="ptab add"><span class="ms sm">add</span>Page</span></div>
  <div class="cap label-small" style="color:var(--on-surface-variant);margin-top:8px">PAGE DOTS (REMOTE)</div>
  <div class="dots" style="justify-content:flex-start"><i class="on"></i><i></i><i></i></div>
  <div class="cap label-small" style="color:var(--on-surface-variant);margin-top:8px">TRASH ZONE WHILE DRAGGING · IDLE / HOVERED</div>
  <div class="trash" style="margin:0"><span class="ms">delete</span>Drop here to remove</div>
  <div class="trash is-hot" style="margin:0"><span class="ms">delete</span>Release to remove</div>
</div>
