<!-- @dsCard group="Connection" height=440 subtitle="Awaiting approval on the TV, and PIN entry" -->
<div class="row" style="padding:16px 24px;gap:48px;align-items:flex-start">
  <div style="width:320px">
    <div class="pair-hero"><div class="tv"><div class="prompt">Allow Zapper to connect?<div class="opts"><b class="on">Allow</b><b>Deny</b></div></div></div><span class="stand"></span></div>
    <div class="steps">
      <div class="step done"><span class="d"><span class="ms sm">check</span></span>Connected to TV</div>
      <div class="step now"><span class="d"><span class="spinner" style="width:14px;height:14px;border-width:2px"></span></span>Accept the request on your TV</div>
      <div class="step"><span class="d">3</span>Ready to use</div>
    </div>
  </div>
  <div style="width:320px;padding-top:24px" class="stack">
    <div class="title-medium" style="text-align:center">Enter the code shown on your TV</div>
    <div class="pin"><span>4</span><span>7</span><span class="is-active"></span><span></span></div>
    <div class="support" style="text-align:center">Code expires in 0:52</div>
  </div>
</div>
