<!-- @dsCard group="Screens" height=860 page subtitle="Default Samsung layout, everything together" -->
<div style="display:flex;justify-content:center;padding:16px">
  <div style="width:360px;border-radius:32px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--outline-variant);overflow:hidden;padding-bottom:8px">
    <div class="topbar"><div class="tv"><span class="label-medium" style="color:var(--on-surface-variant)">Samsung · QE55Q80</span><b>Living room</b></div><span class="chip"><span class="dot"></span>Connected</span><button class="iconbtn" aria-label="Edit layout"><span class="ms">edit</span></button></div>
    <div class="grid" style="grid-template-rows:repeat(8,72px)">
      <button class="rk rk--power" style="grid-column:1;grid-row:1" aria-label="Power"><span class="ms">power_settings_new</span></button>
      <button class="rk" style="grid-column:2;grid-row:1" aria-label="Source"><span class="ms">input</span></button>
      <button class="rk" style="grid-column:3;grid-row:1" aria-label="Menu"><span class="ms">menu</span></button>
      <button class="rk" style="grid-column:4;grid-row:1" aria-label="Settings"><span class="ms">settings</span></button>
      <div class="dpad" style="grid-column:1 / span 3;grid-row:2 / span 3;width:100%;height:100%;justify-self:center">
        <div class="seg up"></div><div class="seg down"></div><div class="seg left"></div><div class="seg right"></div>
        <span class="ms ic up">keyboard_arrow_up</span><span class="ms ic down">keyboard_arrow_down</span><span class="ms ic left">keyboard_arrow_left</span><span class="ms ic right">keyboard_arrow_right</span>
        <div class="ring"></div><button class="ok">OK</button>
      </div>
      <button class="rk rk--secondary" style="grid-column:4;grid-row:2" aria-label="Home"><span class="ms">home</span></button>
      <button class="rk rk--secondary" style="grid-column:4;grid-row:3" aria-label="Back"><span class="ms">arrow_back</span></button>
      <button class="rk" style="grid-column:4;grid-row:4" aria-label="Mute"><span class="ms">volume_off</span></button>
      <div class="rocker" style="grid-column:1;grid-row:5 / span 3"><button aria-label="Volume up"><span class="ms">add</span></button><span class="lbl">VOL</span><button aria-label="Volume down"><span class="ms">remove</span></button></div>
      <button class="app" style="grid-column:2 / span 2;grid-row:5"><span class="mono">N</span>Netflix</button>
      <button class="app app--secondary" style="grid-column:2 / span 2;grid-row:6"><span class="mono">Y</span>YouTube</button>
      <button class="rk" style="grid-column:2;grid-row:7" aria-label="Guide"><span class="ms">view_list</span></button>
      <button class="rk" style="grid-column:3;grid-row:7" aria-label="Info"><span class="ms">info</span></button>
      <div class="rocker" style="grid-column:4;grid-row:5 / span 3"><button aria-label="Channel up"><span class="ms">keyboard_arrow_up</span></button><span class="lbl">CH</span><button aria-label="Channel down"><span class="ms">keyboard_arrow_down</span></button></div>
      <button class="rk" style="grid-column:1;grid-row:8" aria-label="Rewind"><span class="ms">fast_rewind</span></button>
      <button class="rk rk--primary rk--round" style="grid-column:2 / span 2;grid-row:8" aria-label="Play or pause"><span class="ms">play_pause</span></button>
      <button class="rk" style="grid-column:4;grid-row:8" aria-label="Fast forward"><span class="ms">fast_forward</span></button>
    </div>
    <div style="display:flex;justify-content:center;gap:6px;padding-top:4px"><span style="width:16px;height:6px;border-radius:3px;background:var(--primary)"></span><span style="width:6px;height:6px;border-radius:3px;background:var(--outline)"></span><span style="width:6px;height:6px;border-radius:3px;background:var(--outline)"></span></div>
  </div>
</div>
