<div class="row" style="padding:32px 24px;gap:24px;align-items:flex-start;flex-wrap:wrap">
  <div style="width:300px"><div class="field"><span class="lbl">TV IP address</span><span class="ph">e.g. 192.168.1.42</span></div><div class="support">Find it in your TV's network settings.</div></div>
